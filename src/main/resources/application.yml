
spring:
  application:
    name: dataset-operator

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dataset_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
